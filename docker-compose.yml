services:
  neo4j:
    image: neo4j:community
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASS:?set NEO4J_PASS in backend/.env}
    volumes:
      - neo4j_data:/data

  postgis:
    image: postgis/postgis:15-3.4
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGIS_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGIS_PASS:?set POSTGIS_PASS in backend/.env}
      - POSTGRES_DB=${POSTGIS_DB:-cybercrime_gis}
    volumes:
      - postgis_data:/var/lib/postgresql/data

volumes:
  neo4j_data:
  postgis_data:
